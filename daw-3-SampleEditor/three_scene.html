<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>DAW-500 3D Scene</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d0d0d; overflow: hidden; }
        canvas { display: block; }

        #overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #aaa;
            font: 11px/1.6 monospace;
            pointer-events: none;
            text-shadow: 0 0 4px #000;
        }
        #overlay .label { color: #555; }
        #overlay .value { color: #88aaff; }
        #status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #555;
            font: 10px monospace;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="overlay">
    <div><span class="label">Time: </span><span class="value" id="timeDisplay">0</span></div>
    <div><span class="label">Objects: </span><span class="value" id="objCount">0</span></div>
</div>
<div id="status">Connecting to DAW...</div>

<!-- Built-in Qt WebChannel JS helper (no download needed) -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<!--
    Three.js r128.
    For production without internet: download three.min.js, add to qml.qrc,
    then change this src to "qrc:/three.min.js".
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
"use strict";

// ── Scene setup ────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d0d);
scene.fog = new THREE.FogExp2(0x0d0d0d, 0.035);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 6, 14);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ── Lighting ───────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.35));

const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
scene.add(sun);

scene.add(Object.assign(new THREE.DirectionalLight(0x8888ff, 0.25), {
    position: new THREE.Vector3(-5, 3, -5)
}));

// ── Grid ───────────────────────────────────────────────────────────────────
scene.add(new THREE.GridHelper(40, 40, 0x333333, 0x222222));

// ── Entity registry ────────────────────────────────────────────────────────
const TRACK_COLORS = [
    0x4488ff, 0xff4488, 0x44ff88,
    0xffaa44, 0xaa44ff, 0x44ccff,
    0xff8844, 0x88ff44, 0xff44cc
];

const entities = {}; // trackIndex → THREE.Mesh

function getOrCreateEntity(trackIndex) {
    if (entities[trackIndex]) return entities[trackIndex];

    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 24, 16),
        new THREE.MeshPhongMaterial({
            color: TRACK_COLORS[trackIndex % TRACK_COLORS.length],
            shininess: 80,
            emissive: TRACK_COLORS[trackIndex % TRACK_COLORS.length],
            emissiveIntensity: 0.12
        })
    );
    mesh.castShadow = true;
    mesh.userData.trackIndex = trackIndex;
    scene.add(mesh);
    entities[trackIndex] = mesh;
    document.getElementById('objCount').textContent = Object.keys(entities).length;
    return mesh;
}

// ── Orbit camera (mouse drag + scroll) ────────────────────────────────────
let isDragging = false, lastX = 0, lastY = 0;
let theta = 0.4, phi = 1.1, radius = 14;

function updateCamera() {
    camera.position.set(
        radius * Math.sin(phi) * Math.sin(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.cos(theta)
    );
    camera.lookAt(0, 0, 0);
}
updateCamera();

renderer.domElement.addEventListener('mousedown', e => {
    isDragging = true; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    theta -= (e.clientX - lastX) * 0.006;
    phi = Math.max(0.08, Math.min(Math.PI - 0.08, phi - (e.clientY - lastY) * 0.006));
    lastX = e.clientX; lastY = e.clientY;
    updateCamera();
});
renderer.domElement.addEventListener('wheel', e => {
    radius = Math.max(2, Math.min(80, radius + e.deltaY * 0.015));
    updateCamera();
    e.preventDefault();
}, { passive: false });

// ── Render loop ────────────────────────────────────────────────────────────
(function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
})();

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

// ── QWebChannel bridge ─────────────────────────────────────────────────────
function connectBridge() {
    if (typeof QWebChannel === 'undefined' || typeof qt === 'undefined' || !qt.webChannelTransport) {
        document.getElementById('status').textContent =
            typeof qt === 'undefined' ? 'Running standalone (no DAW)' : 'No Qt transport';
        return;
    }

    new QWebChannel(qt.webChannelTransport, function(channel) {
        const bridge = channel.objects.bridge;

        // DAW → Three.js: move an entity to a new position
        bridge.entityPositionChanged.connect(function(trackIndex, x, y, z) {
            getOrCreateEntity(trackIndex).position.set(x, y, z);
        });

        // DAW → Three.js: playhead time tick
        bridge.playheadMoved.connect(function(time) {
            document.getElementById('timeDisplay').textContent = time.toFixed(0);
        });

        // DAW → Three.js: project reset / new project loaded
        bridge.sceneReset.connect(function() {
            Object.values(entities).forEach(m => scene.remove(m));
            Object.keys(entities).forEach(k => delete entities[k]);
            document.getElementById('objCount').textContent = '0';
        });

        document.getElementById('status').textContent = 'Connected to DAW';

        // Example reverse call (extend for drag interaction later):
        // bridge.entityMovedInScene(trackIndex, x, y, z);
    });
}

// qt.webChannelTransport is injected asynchronously by Qt; guard for both cases.
if (typeof qt !== 'undefined' && qt.webChannelTransport) {
    connectBridge();
} else {
    window.addEventListener('DOMContentLoaded', connectBridge);
    setTimeout(connectBridge, 250); // fallback for slow injection
}
</script>
</body>
</html>
