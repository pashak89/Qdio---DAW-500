<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DAW-500 Three.js 2D Scene</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1e1e1e;
               font-family: 'Courier New', monospace; }
  #status   { position: absolute; top: 6px; right: 160px; color: #777;
              font-size: 10px; letter-spacing: 1px; }
  #projInfo { position: absolute; top: 36px; left: 50%; transform: translateX(-50%);
              color: #777; font-size: 11px; letter-spacing: 2px; }
  #projSel  { position: absolute; top: 6px; right: 8px; width: 140px;
              background: #2a2a2a; color: #ccc; border: 1px solid #444;
              font-family: 'Courier New', monospace; font-size: 11px; padding: 2px; }
  #hint     { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
              color: #444; font-size: 10px; }
  #gizmo    { position: absolute; left: 8px; bottom: 8px; width: 80px; height: 80px;
              pointer-events: none; }
</style>
</head>
<body>
<div id="status">connecting…</div>
<div id="projInfo">TOP   (X / Z)</div>
<select id="projSel">
  <option value="top">Top  (X/Z)</option>
  <option value="front">Front (X/Y)</option>
  <option value="side">Side  (Z/Y)</option>
</select>
<div id="hint">Drag: pan | Scroll: zoom | Click sphere: select</div>
<canvas id="gizmo"></canvas>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
<script>
'use strict';

const PALETTE = ['#4488ff','#ff4488','#44ff88','#ffaa44',
                 '#aa44ff','#44ccff','#ff8844','#88ff44'];
const BASE_SIZE = 10;
const PROJECTIONS = {
    top:   { pos: [0, 100, 0],  up: [0, 0, -1], label: 'TOP   (X / Z)' },
    front: { pos: [0, 0, 100],  up: [0, 1,  0], label: 'FRONT (X / Y)' },
    side:  { pos: [100, 0, 0],  up: [0, 1,  0], label: 'SIDE  (Z / Y)' },
};

const $status   = document.getElementById('status');
const $projInfo = document.getElementById('projInfo');
const $projSel  = document.getElementById('projSel');

let projection = 'top';
let zoomFactor = 1.0;

// ── Main scene ──────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1e1e);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const fill = new THREE.DirectionalLight(0x888888, 0.8);
fill.position.set(5, 10, 7);
scene.add(fill);

// 30×30 floor grid centred at the origin (matches the 3D scene)
scene.add(new THREE.GridHelper(30, 30, 0x484848, 0x333333));

// ── Orthographic camera ────────────────────────────────────────────────────
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
function applyProjectionFrustum() {
    const aspect = window.innerWidth / Math.max(1, window.innerHeight);
    const halfH = BASE_SIZE * zoomFactor;
    const halfW = halfH * aspect;
    camera.left = -halfW;  camera.right = halfW;
    camera.top  =  halfH;  camera.bottom = -halfH;
    camera.updateProjectionMatrix();
}
function applyProjection(name) {
    projection = name;
    const p = PROJECTIONS[name];
    camera.position.set(p.pos[0], p.pos[1], p.pos[2]);
    camera.up.set(p.up[0], p.up[1], p.up[2]);
    camera.lookAt(0, 0, 0);
    panOffset.set(0, 0);
    zoomFactor = 1.0;
    applyProjectionFrustum();
    $projInfo.textContent = p.label;
    syncGizmo();
}

// Pan offset is tracked in world units (perpendicular to projection normal)
const panOffset = new THREE.Vector2(0, 0);
function applyPanZoom() {
    const p = PROJECTIONS[projection];
    if (projection === 'top') {
        // Looking down -Y. screen-X = world X, screen-up = world -Z
        camera.position.set(p.pos[0] + panOffset.x, p.pos[1], p.pos[2] - panOffset.y);
    } else if (projection === 'front') {
        camera.position.set(p.pos[0] + panOffset.x, p.pos[1] + panOffset.y, p.pos[2]);
    } else { // side
        camera.position.set(p.pos[0], p.pos[1] + panOffset.y, p.pos[2] - panOffset.x);
    }
    camera.lookAt(camera.position.x - p.pos[0] * 0,    // target = camera - normal
                  camera.position.y - p.pos[1] * 0,
                  camera.position.z - p.pos[2] * 0);
    // Simpler: target is camera position projected onto Y=0 (top) etc.
    if (projection === 'top')   camera.lookAt(camera.position.x, 0, camera.position.z);
    if (projection === 'front') camera.lookAt(camera.position.x, camera.position.y, 0);
    if (projection === 'side')  camera.lookAt(0, camera.position.y, camera.position.z);
    applyProjectionFrustum();
}

// ── Renderer ───────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    applyProjectionFrustum();
});

// ── Track entities ─────────────────────────────────────────────────────────
const entities = new Map();
function ensureEntity(trackIndex) {
    if (entities.has(trackIndex)) return entities.get(trackIndex);
    const baseColor = new THREE.Color(PALETTE[Math.abs(trackIndex) % PALETTE.length]);
    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 32, 16),
        new THREE.MeshPhongMaterial({
            color: baseColor,
            emissive: baseColor.clone().multiplyScalar(0.30),
            shininess: 80, transparent: true, opacity: 0.95,
        }));
    mesh.userData.trackIndex = trackIndex;
    scene.add(mesh);
    const entry = { mesh, baseColor };
    entities.set(trackIndex, entry);
    return entry;
}
function setSelectedTrack(trackIndex) {
    for (const [k, e] of entities) {
        const sel = (k === trackIndex);
        e.mesh.scale.setScalar(sel ? 1.3 : 1.0);
        e.mesh.material.emissive.copy(e.baseColor).multiplyScalar(sel ? 0.85 : 0.30);
    }
}
function clearAllEntities() {
    for (const e of entities.values()) {
        scene.remove(e.mesh);
        e.mesh.geometry.dispose();
        e.mesh.material.dispose();
    }
    entities.clear();
}

// ── Pan / zoom / click ─────────────────────────────────────────────────────
let dragging = false, lastX = 0, lastY = 0, pressX = 0, pressY = 0;
renderer.domElement.addEventListener('pointerdown', (ev) => {
    dragging = true; lastX = ev.clientX; lastY = ev.clientY;
    pressX = ev.clientX; pressY = ev.clientY;
});
renderer.domElement.addEventListener('pointerup', (ev) => {
    dragging = false;
    if (Math.hypot(ev.clientX - pressX, ev.clientY - pressY) <= 4) {
        // It's a click — try to pick a sphere
        const ray = new THREE.Raycaster();
        const ndc = new THREE.Vector2(
            (ev.clientX / window.innerWidth) * 2 - 1,
            -(ev.clientY / window.innerHeight) * 2 + 1);
        ray.setFromCamera(ndc, camera);
        const meshes = [...entities.values()].map(e => e.mesh);
        const hits = ray.intersectObjects(meshes, false);
        if (hits.length && window.scene3D) {
            const idx = hits[0].object.userData.trackIndex;
            if (idx !== undefined) window.scene3D.entityClicked(idx);
        }
    }
});
renderer.domElement.addEventListener('pointermove', (ev) => {
    if (!dragging) return;
    const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
    lastX = ev.clientX; lastY = ev.clientY;
    const k = (BASE_SIZE * 2.0 * zoomFactor) / Math.max(window.innerHeight, 1);
    panOffset.x -= dx * k;
    panOffset.y += dy * k;
    applyPanZoom();
});
renderer.domElement.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const step = ev.deltaY < 0 ? (1 / 1.10) : 1.10;
    zoomFactor = Math.max(0.05, Math.min(8.0, zoomFactor * step));
    applyProjectionFrustum();
}, { passive: false });

$projSel.addEventListener('change', (ev) => applyProjection(ev.target.value));

// ── Gizmo (own scene + canvas, mirrors the projection direction) ──────────
const gCanvas = document.getElementById('gizmo');
const gRenderer = new THREE.WebGLRenderer({
    canvas: gCanvas, antialias: true, alpha: true });
gRenderer.setPixelRatio(window.devicePixelRatio);
gRenderer.setSize(80, 80, false);
gRenderer.setClearColor(0x000000, 0);
const gScene = new THREE.Scene();
gScene.add(new THREE.AxesHelper(0.9));
const gCamera = new THREE.PerspectiveCamera(50, 1, 0.01, 10);
function syncGizmo() {
    const p = PROJECTIONS[projection];
    const dir = new THREE.Vector3(p.pos[0], p.pos[1], p.pos[2]).normalize();
    gCamera.position.copy(dir.multiplyScalar(2.5));
    gCamera.up.set(p.up[0], p.up[1], p.up[2]);
    gCamera.lookAt(0, 0, 0);
}
syncGizmo();

// ── Animate ────────────────────────────────────────────────────────────────
applyProjection('top');
(function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
    gRenderer.render(gScene, gCamera);
})();

// ── QWebChannel bridge ─────────────────────────────────────────────────────
new QWebChannel(qt.webChannelTransport, (channel) => {
    const scene3D = channel.objects.scene3D;
    window.scene3D = scene3D;
    $status.textContent = 'connected';

    scene3D.entityAdded.connect((trackIndex, position) => {
        const e = ensureEntity(trackIndex);
        e.mesh.position.set(position.x, position.y, position.z);
    });
    scene3D.entityPositionChanged.connect((trackIndex, position) => {
        const e = ensureEntity(trackIndex);
        e.mesh.position.set(position.x, position.y, position.z);
    });
    scene3D.trackSelected.connect((trackIndex) => setSelectedTrack(trackIndex));
    scene3D.sceneReset.connect(() => clearAllEntities());

    scene3D.entityIds((ids) => {
        ids.forEach((id) => {
            scene3D.entityPosition(id, (pos) => {
                const e = ensureEntity(id);
                e.mesh.position.set(pos.x, pos.y, pos.z);
            });
        });
    });
});
</script>
</body>
</html>
