<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DAW-500 Three.js 2D Scene</title>
<style>
  @font-face {
    font-family: 'Source Sans Pro';
    src: url('qrc:///Resource/font/SourceSansPro-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1e1e1e;
               font-family: 'Source Sans Pro', sans-serif; }
  #status, #projInfo, #hint, #projSel {
      font-family: 'Source Sans Pro', sans-serif;
      font-size: 13px;
      font-weight: normal;
      color: #aaa;
      letter-spacing: 0;
      line-height: 1;
  }
  #status   { position: absolute; top: 8px;  right: 160px; }
  #projInfo { position: absolute; top: 36px; left: 50%; transform: translateX(-50%); }
  #hint     { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); }
  #projSel  { position: absolute; top: 6px; right: 8px; width: 140px;
              background: #2a2a2a; border: 1px solid #444; padding: 3px 6px;
              -webkit-appearance: none; appearance: none; }
  #gizmoWrap { position: absolute; left: 8px; bottom: 28px; width: 80px; height: 80px;
               pointer-events: none; }
  #gizmoWrap canvas { position: absolute; left: 0; top: 0; width: 80px; height: 80px; }
</style>
</head>
<body>
<div id="status">connecting…</div>
<div id="projInfo">TOP (X / Z)</div>
<select id="projSel">
  <option value="top">Top (X / Z)</option>
  <option value="front">Front (X / Y)</option>
  <option value="side">Side (Z / Y)</option>
</select>
<div id="hint">Drag empty: pan | Drag sphere: move | Scroll: zoom | Click sphere: select</div>
<div id="gizmoWrap">
  <canvas id="gizmo"></canvas>
  <canvas id="gizmoLbl"></canvas>
</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="qrc:///web/lib/three.min.js"></script>
<script src="qrc:///web/lib/TransformControls.js"></script>
<script>
'use strict';

const DEFAULT_COLOR = '#888888';
const BASE_SIZE = 10;
let selectedTrackIndex = -1;
const PROJECTIONS = {
    top:   { pos: [0, 100, 0],  up: [0, 0, -1], label: 'TOP (X / Z)' },
    front: { pos: [0, 0, 100],  up: [0, 1,  0], label: 'FRONT (X / Y)' },
    side:  { pos: [100, 0, 0],  up: [0, 1,  0], label: 'SIDE (Z / Y)' },
};

const $status   = document.getElementById('status');
const $projInfo = document.getElementById('projInfo');
const $projSel  = document.getElementById('projSel');

let projection = 'top';
let zoomFactor = 1.0;

// ── Main scene ──────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1e1e);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const fill = new THREE.DirectionalLight(0x888888, 0.8);
fill.position.set(5, 10, 7);
scene.add(fill);

// 30×30 floor grid centred at the origin (matches the 3D scene)
scene.add(new THREE.GridHelper(30, 30, 0x484848, 0x333333));

// ── Orthographic camera ────────────────────────────────────────────────────
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
function applyProjectionFrustum() {
    const aspect = window.innerWidth / Math.max(1, window.innerHeight);
    const halfH = BASE_SIZE * zoomFactor;
    const halfW = halfH * aspect;
    camera.left = -halfW;  camera.right = halfW;
    camera.top  =  halfH;  camera.bottom = -halfH;
    camera.updateProjectionMatrix();
}
function applyProjection(name) {
    projection = name;
    const p = PROJECTIONS[name];
    camera.position.set(p.pos[0], p.pos[1], p.pos[2]);
    camera.up.set(p.up[0], p.up[1], p.up[2]);
    camera.lookAt(0, 0, 0);
    panOffset.set(0, 0);
    zoomFactor = 1.0;
    applyProjectionFrustum();
    $projInfo.textContent = p.label;
    syncGizmo();
    if (typeof transformCtl !== 'undefined') applyGizmoAxes();
}

// Pan offset is tracked in world units (perpendicular to projection normal)
const panOffset = new THREE.Vector2(0, 0);
function applyPanZoom() {
    const p = PROJECTIONS[projection];
    if (projection === 'top') {
        // Looking down -Y. screen-X = world X, screen-up = world -Z
        camera.position.set(p.pos[0] + panOffset.x, p.pos[1], p.pos[2] - panOffset.y);
    } else if (projection === 'front') {
        camera.position.set(p.pos[0] + panOffset.x, p.pos[1] + panOffset.y, p.pos[2]);
    } else { // side
        camera.position.set(p.pos[0], p.pos[1] + panOffset.y, p.pos[2] - panOffset.x);
    }
    camera.lookAt(camera.position.x - p.pos[0] * 0,    // target = camera - normal
                  camera.position.y - p.pos[1] * 0,
                  camera.position.z - p.pos[2] * 0);
    // Simpler: target is camera position projected onto Y=0 (top) etc.
    if (projection === 'top')   camera.lookAt(camera.position.x, 0, camera.position.z);
    if (projection === 'front') camera.lookAt(camera.position.x, camera.position.y, 0);
    if (projection === 'side')  camera.lookAt(0, camera.position.y, camera.position.z);
    applyProjectionFrustum();
}

// ── Renderer ───────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    applyProjectionFrustum();
});

// ── In-plane drag gizmo (TransformControls — only the 2 axes of the projection) ──
const transformCtl = new THREE.TransformControls(camera, renderer.domElement);
transformCtl.setMode('translate');
transformCtl.setSize(1.5);
scene.add(transformCtl);

function applyGizmoAxes() {
    transformCtl.showX = (projection !== 'side');
    transformCtl.showY = (projection !== 'top');
    transformCtl.showZ = (projection !== 'front');
}

// Gizmo (XYZ axis arrows): live preview during drag, commit on release.
// commitObjectLocation in C++ gates by Auto Key Mode — when ON it writes a kf,
// when OFF the position update is purely visual.
let gizmoDragging = false;
let _xform2dLastTrack = -1;
transformCtl.addEventListener('dragging-changed', (ev) => {
    gizmoDragging = ev.value;
    if (!ev.value && _xform2dLastTrack >= 0 && transformCtl.object && window.scene3D) {
        const obj = transformCtl.object;
        window.scene3D.entityCommittedInScene(_xform2dLastTrack,
            obj.position.x, obj.position.y, obj.position.z);
        _xform2dLastTrack = -1;
    }
});
transformCtl.addEventListener('objectChange', () => {
    const obj = transformCtl.object;
    if (!obj || !window.scene3D) return;
    const idx = obj.userData.trackIndex;
    if (idx !== undefined) {
        _xform2dLastTrack = idx;
        window.scene3D.entityMovedLiveInScene(idx, obj.position.x, obj.position.y, obj.position.z);
    }
});

// ── Track entities ─────────────────────────────────────────────────────────
const entities = new Map();

// ── Keyframes & paths (Phase 1) ────────────────────────────────────────────
const kfMarkers = new Map();   // trackIndex -> Map<kfId, { mesh, interp }>
const pathLines = new Map();   // trackIndex -> THREE.Line
const KF_INTERP_HOLD = 0;
const KF_INTERP_LINEAR = 1;
const KF_INTERP_BEZIER = 2;

// Phase 2: JS-side clock seeded by audio clock, anchored by batch frame arrivals
let playStartMs = 0;
let playStartPerfNow = 0;
let isPlaying = false;

// Phase 2: spatial state snapshot — per-track {x, y, z, radius}
const spatialCache = new Map();

function makeKfGeometry(interp) {
    if (interp === KF_INTERP_LINEAR) return new THREE.OctahedronGeometry(0.13, 0);
    if (interp === KF_INTERP_HOLD)   return new THREE.BoxGeometry(0.18, 0.18, 0.18);
    return new THREE.SphereGeometry(0.10, 16, 16);
}
function trackBaseColor(trackIndex) {
    const e = entities.get(trackIndex);
    return e ? e.baseColor : new THREE.Color(DEFAULT_COLOR);
}
function clearKeyframesForTrack(trackIndex) {
    const m = kfMarkers.get(trackIndex);
    if (m) {
        for (const { mesh } of m.values()) {
            scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose();
        }
        m.clear();
    }
}
function addKfMarker(trackIndex, kfId, x, y, z, interp) {
    let map = kfMarkers.get(trackIndex);
    if (!map) { map = new Map(); kfMarkers.set(trackIndex, map); }
    const existing = map.get(kfId);
    if (existing) {
        scene.remove(existing.mesh);
        existing.mesh.geometry.dispose();
        existing.mesh.material.dispose();
    }
    const baseColor = trackBaseColor(trackIndex);
    const mat = new THREE.MeshPhongMaterial({
        color: baseColor,
        emissive: baseColor.clone().multiplyScalar(0.6),
        shininess: 60,
    });
    const mesh = new THREE.Mesh(makeKfGeometry(interp), mat);
    mesh.position.set(x, y, z);
    mesh.userData = { type: 'keyframe', trackIndex, kfId, interp };
    scene.add(mesh);
    map.set(kfId, { mesh, interp });
}
function updateKfMarker(trackIndex, kfId, x, y, z, interp) {
    const map = kfMarkers.get(trackIndex);
    const entry = map ? map.get(kfId) : null;
    if (!entry) { addKfMarker(trackIndex, kfId, x, y, z, interp); return; }
    entry.mesh.position.set(x, y, z);
    if (entry.interp !== interp) {
        entry.mesh.geometry.dispose();
        entry.mesh.geometry = makeKfGeometry(interp);
        entry.mesh.userData.interp = interp;
        entry.interp = interp;
    }
}
function removeKfMarker(trackIndex, kfId) {
    const map = kfMarkers.get(trackIndex);
    const entry = map ? map.get(kfId) : null;
    if (!entry) return;
    scene.remove(entry.mesh);
    entry.mesh.geometry.dispose();
    entry.mesh.material.dispose();
    map.delete(kfId);
}
function setPathFor(trackIndex, flat) {
    const haveData = !!flat && flat.length >= 6;
    let line = pathLines.get(trackIndex);
    if (!haveData) {
        if (line) { scene.remove(line); line.geometry.dispose(); line.material.dispose(); pathLines.delete(trackIndex); }
        return;
    }
    if (line && line.geometry.attributes.position
        && line.geometry.attributes.position.array.length === flat.length) {
        const arr = line.geometry.attributes.position.array;
        for (let i = 0; i < flat.length; ++i) arr[i] = flat[i];
        line.geometry.attributes.position.needsUpdate = true;
        line.geometry.computeBoundingSphere();
        return;
    }
    if (line) { scene.remove(line); line.geometry.dispose(); line.material.dispose(); }
    const baseColor = trackBaseColor(trackIndex);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(flat, 3));
    line = new THREE.Line(geo, new THREE.LineBasicMaterial({
        color: baseColor, transparent: true, opacity: 0.7,
    }));
    scene.add(line);
    pathLines.set(trackIndex, line);
}
// ── Phase 2: Bezier tangent handle visualisation ────────────────────────────
const tangentHandles = { inMesh: null, outMesh: null, inLine: null, outLine: null, kfId: null };

function clearTangentHandles() {
    for (const k of ['inMesh', 'outMesh', 'inLine', 'outLine']) {
        if (tangentHandles[k]) {
            scene.remove(tangentHandles[k]);
            tangentHandles[k].geometry.dispose();
            if (tangentHandles[k].material) tangentHandles[k].material.dispose();
            tangentHandles[k] = null;
        }
    }
    tangentHandles.kfId = null;
}

function showTangentHandles(kfId, kx, ky, kz, inX, inY, inZ, outX, outY, outZ) {
    const kfPos  = new THREE.Vector3(kx, ky, kz);
    const inPos  = new THREE.Vector3(kx + inX,  ky + inY,  kz + inZ);
    const outPos = new THREE.Vector3(kx + outX, ky + outY, kz + outZ);

    if (tangentHandles.kfId === kfId && tangentHandles.inMesh) {
        tangentHandles.inMesh.position.copy(inPos);
        tangentHandles.outMesh.position.copy(outPos);
        updateTangentLine(tangentHandles.inLine,  kfPos, inPos);
        updateTangentLine(tangentHandles.outLine, kfPos, outPos);
        tangentHandles.kfPos = kfPos;
        return;
    }

    clearTangentHandles();
    tangentHandles.kfId = kfId;
    tangentHandles.kfPos = kfPos;
    const hColor  = new THREE.Color(0xffaa00);
    const mkMat   = () => new THREE.MeshPhongMaterial({
        color: hColor, emissive: hColor.clone().multiplyScalar(0.5) });
    const mkLine  = (a, b) => new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([a, b]),
        new THREE.LineBasicMaterial({ color: hColor, transparent: true, opacity: 0.7 }));
    const hGeom = new THREE.SphereGeometry(0.09, 12, 12);

    tangentHandles.inMesh  = new THREE.Mesh(hGeom.clone(), mkMat());
    tangentHandles.inMesh.position.copy(inPos);
    tangentHandles.inMesh.userData = { type: 'tangent', kfId, side: 'in' };
    scene.add(tangentHandles.inMesh);

    tangentHandles.outMesh = new THREE.Mesh(hGeom.clone(), mkMat());
    tangentHandles.outMesh.position.copy(outPos);
    tangentHandles.outMesh.userData = { type: 'tangent', kfId, side: 'out' };
    scene.add(tangentHandles.outMesh);

    tangentHandles.inLine  = mkLine(kfPos, inPos);
    scene.add(tangentHandles.inLine);
    tangentHandles.outLine = mkLine(kfPos, outPos);
    scene.add(tangentHandles.outLine);

    hGeom.dispose();
}

function updateTangentLine(line, a, b) {
    const pos = line.geometry.attributes.position;
    pos.array[0] = a.x; pos.array[1] = a.y; pos.array[2] = a.z;
    pos.array[3] = b.x; pos.array[4] = b.y; pos.array[5] = b.z;
    pos.needsUpdate = true;
    line.geometry.computeBoundingSphere();
}

function setHandleHighlight(mesh, hover) {
    if (!mesh) return;
    const m = mesh.material;
    const c = new THREE.Color(0xffaa00);
    if (hover) {
        m.color.set(0xffe066);
        m.emissive.copy(c);
        mesh.scale.setScalar(1.35);
    } else {
        m.color.copy(c);
        m.emissive.copy(c).multiplyScalar(0.5);
        mesh.scale.setScalar(1.0);
    }
}

function ensureEntity(trackIndex) {
    if (entities.has(trackIndex)) return entities.get(trackIndex);
    const baseColor = new THREE.Color(DEFAULT_COLOR);
    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 32, 16),
        new THREE.MeshPhongMaterial({
            color: baseColor,
            emissive: baseColor.clone().multiplyScalar(0.30),
            shininess: 80, transparent: true, opacity: 0.95,
        }));
    mesh.userData.trackIndex = trackIndex;
    scene.add(mesh);
    const entry = { mesh, baseColor };
    entities.set(trackIndex, entry);
    return entry;
}
function applyEntityColor(trackIndex, hex) {
    const e = entities.get(trackIndex);
    if (!e || !hex) return;
    e.baseColor.set(hex);
    e.mesh.material.color.copy(e.baseColor);
    const sel = (trackIndex === selectedTrackIndex);
    e.mesh.material.emissive.copy(e.baseColor).multiplyScalar(sel ? 0.85 : 0.30);
}
function applyEntityVisibility(trackIndex, visible) {
    const e = entities.get(trackIndex);
    if (!e) return;
    e.mesh.visible = visible;
    if (!visible && transformCtl && transformCtl.object === e.mesh) transformCtl.detach();
}
function setSelectedTrack(trackIndex) {
    selectedTrackIndex = trackIndex;
    for (const [k, e] of entities) {
        const sel = (k === trackIndex);
        e.mesh.scale.setScalar(sel ? 1.3 : 1.0);
        e.mesh.material.emissive.copy(e.baseColor).multiplyScalar(sel ? 0.85 : 0.30);
    }
    const target = entities.get(trackIndex);
    if (target && target.mesh.visible) {
        applyGizmoAxes();
        transformCtl.attach(target.mesh);
    } else {
        transformCtl.detach();
    }
}
function clearAllEntities() {
    if (transformCtl) transformCtl.detach();
    for (const e of entities.values()) {
        scene.remove(e.mesh);
        e.mesh.geometry.dispose();
        e.mesh.material.dispose();
    }
    entities.clear();
}

// ── Pan / zoom / click / sphere-drag ───────────────────────────────────────
let dragging = false, lastX = 0, lastY = 0, pressX = 0, pressY = 0;
let dragMode = 'none';                                  // 'none' | 'pan' | 'entity'
let draggedMesh = null;
const dragPlane  = new THREE.Plane();
const dragOffset = new THREE.Vector3();
const dragHit    = new THREE.Vector3();
const dragRay    = new THREE.Raycaster();
const dragNdc    = new THREE.Vector2();

function eventNdc(ev) {
    const r = renderer.domElement.getBoundingClientRect();
    dragNdc.x =  ((ev.clientX - r.left) / r.width)  * 2 - 1;
    dragNdc.y = -((ev.clientY - r.top)  / r.height) * 2 + 1;
}
function pickEntityAt(ev) {
    eventNdc(ev);
    dragRay.setFromCamera(dragNdc, camera);
    const meshes = [...entities.values()].filter(e => e.mesh.visible).map(e => e.mesh);
    const hits = dragRay.intersectObjects(meshes, false);
    return hits.length ? hits[0].object : null;
}
function pickKfAt(ev) {
    eventNdc(ev);
    dragRay.setFromCamera(dragNdc, camera);
    const kfMeshes = [];
    for (const map of kfMarkers.values()) {
        for (const { mesh } of map.values()) kfMeshes.push(mesh);
    }
    if (!kfMeshes.length) return null;
    const hits = dragRay.intersectObjects(kfMeshes, false);
    return hits.length ? hits[0].object : null;
}
function rayPlaneTo(ev, target) {
    eventNdc(ev);
    dragRay.setFromCamera(dragNdc, camera);
    return dragRay.ray.intersectPlane(dragPlane, target);
}

// ── Tangent-handle drag (Phase 3) ───────────────────────────────────────────
const tdPlane = new THREE.Plane();
const tdHit   = new THREE.Vector3();
let tDrag = null;
let tHover = null;

function tangentMeshes() {
    const out = [];
    if (tangentHandles.inMesh)  out.push(tangentHandles.inMesh);
    if (tangentHandles.outMesh) out.push(tangentHandles.outMesh);
    return out;
}
function pickTangentAt(ev) {
    const meshes = tangentMeshes();
    if (!meshes.length) return null;
    eventNdc(ev);
    dragRay.setFromCamera(dragNdc, camera);
    const hits = dragRay.intersectObjects(meshes, false);
    return hits.length ? hits[0].object : null;
}

renderer.domElement.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0) return;
    const hit = pickTangentAt(ev);
    if (!hit) return;
    ev.stopPropagation();
    ev.preventDefault();
    if (transformCtl) transformCtl.enabled = false;
    try { renderer.domElement.setPointerCapture(ev.pointerId); } catch (_) {}
    tDrag = { mesh: hit, side: hit.userData.side };
    setHandleHighlight(hit, true);
    // Plane facing the camera through the kf center
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    tdPlane.setFromNormalAndCoplanarPoint(camDir.normalize(), tangentHandles.kfPos);
}, true);

renderer.domElement.addEventListener('pointermove', (ev) => {
    if (tDrag) {
        eventNdc(ev);
        dragRay.setFromCamera(dragNdc, camera);
        if (dragRay.ray.intersectPlane(tdPlane, tdHit) && window.scene3D) {
            const off = tdHit.clone().sub(tangentHandles.kfPos);
            tDrag.lastVec = { x: off.x, y: off.y, z: off.z };
            window.scene3D.tangentChangedLiveInScene(
                tangentHandles.kfId, tDrag.side, off.x, off.y, off.z);
        }
        return;
    }
    const hit = pickTangentAt(ev);
    if (hit !== tHover) {
        if (tHover) setHandleHighlight(tHover, false);
        tHover = hit;
        if (tHover) setHandleHighlight(tHover, true);
        renderer.domElement.style.cursor = tHover ? 'grab' : '';
    }
}, true);

function endTangentDrag(ev) {
    if (!tDrag) return;
    try { renderer.domElement.releasePointerCapture(ev.pointerId); } catch (_) {}
    setHandleHighlight(tDrag.mesh, false);
    if (tDrag.lastVec && tangentHandles.kfId && window.scene3D) {
        window.scene3D.tangentCommittedInScene(
            tangentHandles.kfId, tDrag.side,
            tDrag.lastVec.x, tDrag.lastVec.y, tDrag.lastVec.z);
    }
    tDrag = null;
    if (transformCtl) transformCtl.enabled = true;
}
renderer.domElement.addEventListener('pointerup',     endTangentDrag, true);
renderer.domElement.addEventListener('pointercancel', endTangentDrag, true);
window.addEventListener('blur', () => { if (tDrag) endTangentDrag({ pointerId: -1 }); });

let kfPickedAtPress = null;
renderer.domElement.addEventListener('pointerdown', (ev) => {
    if (tDrag) return;
    if (gizmoDragging) return;   // TransformControls owns this gesture
    dragging = true; lastX = ev.clientX; lastY = ev.clientY;
    pressX = ev.clientX; pressY = ev.clientY;
    kfPickedAtPress = null;

    // Try kf markers first — they're small & user-intent specific.
    const kfHit = pickKfAt(ev);
    if (kfHit && kfHit.userData && kfHit.userData.kfId !== undefined) {
        kfPickedAtPress = {
            trackIndex: kfHit.userData.trackIndex,
            kfId: kfHit.userData.kfId,
        };
        dragMode = 'none';
        draggedMesh = null;
        return;
    }

    const hit = pickEntityAt(ev);
    if (hit) {
        dragMode = 'entity';
        draggedMesh = hit;
        // Plane through the sphere center, facing the camera
        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.normalize(), hit.position);
        if (rayPlaneTo(ev, dragHit)) dragOffset.copy(dragHit).sub(hit.position);
        else                          dragOffset.set(0, 0, 0);
    } else {
        dragMode = 'pan';
        draggedMesh = null;
    }
});
renderer.domElement.addEventListener('pointerup', (ev) => {
    dragging = false;
    const moved = Math.hypot(ev.clientX - pressX, ev.clientY - pressY);
    if (kfPickedAtPress && moved <= 4 && window.scene3D) {
        window.scene3D.keyframeClickedInScene(kfPickedAtPress.trackIndex, kfPickedAtPress.kfId);
    }
    kfPickedAtPress = null;
    if (dragMode === 'entity' && draggedMesh && window.scene3D) {
        const idx = draggedMesh.userData.trackIndex;
        if (idx !== undefined) {
            if (moved <= 4) {
                // No real movement → treat as click → select
                window.scene3D.entityClicked(idx);
            } else {
                // Drag release → commit (Auto Key Mode decides kf write).
                window.scene3D.entityCommittedInScene(idx,
                    draggedMesh.position.x, draggedMesh.position.y, draggedMesh.position.z);
            }
        }
    }
    dragMode = 'none';
    draggedMesh = null;
});
renderer.domElement.addEventListener('pointermove', (ev) => {
    if (!dragging) return;
    if (dragMode === 'entity' && draggedMesh) {
        if (rayPlaneTo(ev, dragHit)) {
            draggedMesh.position.copy(dragHit).sub(dragOffset);
            if (window.scene3D) {
                const idx = draggedMesh.userData.trackIndex;
                if (idx !== undefined)
                    window.scene3D.entityMovedLiveInScene(idx,
                        draggedMesh.position.x, draggedMesh.position.y, draggedMesh.position.z);
            }
        }
        lastX = ev.clientX; lastY = ev.clientY;
    } else if (dragMode === 'pan') {
        const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
        lastX = ev.clientX; lastY = ev.clientY;
        const k = (BASE_SIZE * 2.0 * zoomFactor) / Math.max(window.innerHeight, 1);
        panOffset.x -= dx * k;
        panOffset.y += dy * k;
        applyPanZoom();
    }
});
renderer.domElement.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const step = ev.deltaY < 0 ? (1 / 1.10) : 1.10;
    zoomFactor = Math.max(0.05, Math.min(8.0, zoomFactor * step));
    applyProjectionFrustum();
}, { passive: false });

$projSel.addEventListener('change', (ev) => applyProjection(ev.target.value));

// ── Gizmo (own scene + canvas, mirrors the projection direction) ──────────
const gCanvas = document.getElementById('gizmo');
const gRenderer = new THREE.WebGLRenderer({
    canvas: gCanvas, antialias: true, alpha: true });
gRenderer.setPixelRatio(window.devicePixelRatio);
gRenderer.setSize(80, 80, false);
gRenderer.setClearColor(0x000000, 0);
const gScene = new THREE.Scene();
gScene.add(new THREE.AxesHelper(0.9));
const gCamera = new THREE.PerspectiveCamera(50, 1, 0.01, 10);
function syncGizmo() {
    const p = PROJECTIONS[projection];
    const dir = new THREE.Vector3(p.pos[0], p.pos[1], p.pos[2]).normalize();
    gCamera.position.copy(dir.multiplyScalar(2.5));
    gCamera.up.set(p.up[0], p.up[1], p.up[2]);
    gCamera.lookAt(0, 0, 0);
}
syncGizmo();

// ── Gizmo labels (overlay canvas) ─────────────────────────────────────────
const gLblCanvas = document.getElementById('gizmoLbl');
const gLblCtx = gLblCanvas.getContext('2d');
gLblCanvas.width = 80;
gLblCanvas.height = 80;

function drawGizmoLabels() {
    gLblCtx.clearRect(0, 0, 80, 80);
    gLblCtx.font = '13px "Source Sans Pro", sans-serif';
    const axes = [
        { dir: new THREE.Vector3(1, 0, 0), label: 'X', color: '#ff5555' },
        { dir: new THREE.Vector3(0, 1, 0), label: 'Y', color: '#55ee55' },
        { dir: new THREE.Vector3(0, 0, 1), label: 'Z', color: '#5599ff' },
    ];
    for (const ax of axes) {
        const v = ax.dir.clone().multiplyScalar(0.9);
        v.project(gCamera);
        const x = (v.x + 1) / 2 * 80;
        const y = (1 - (v.y + 1) / 2) * 80;
        gLblCtx.fillStyle = ax.color;
        gLblCtx.fillText(ax.label, x + 2, y + 4);
    }
}

// ── Animate ────────────────────────────────────────────────────────────────
applyProjection('top');
document.fonts.ready.then(() => {
    (function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
        gRenderer.render(gScene, gCamera);
        drawGizmoLabels();
    })();
});

// ── QWebChannel bridge ─────────────────────────────────────────────────────
function bootstrapEntity(scene3D, id) {
    ensureEntity(id);
    scene3D.entityColor(id, (hex) => applyEntityColor(id, hex));
    scene3D.entityVisible(id, (vis) => applyEntityVisibility(id, vis));
}

new QWebChannel(qt.webChannelTransport, (channel) => {
    const scene3D = channel.objects.scene3D;
    window.scene3D = scene3D;
    $status.textContent = 'connected';

    scene3D.entityAdded.connect((trackIndex, x, y, z) => {
        const e = ensureEntity(trackIndex);
        e.mesh.position.set(x, y, z);
        scene3D.entityColor(trackIndex, (hex) => applyEntityColor(trackIndex, hex));
        scene3D.entityVisible(trackIndex, (vis) => applyEntityVisibility(trackIndex, vis));
    });
    scene3D.entityPositionChanged.connect((trackIndex, x, y, z) => {
        const e = ensureEntity(trackIndex);
        e.mesh.position.set(x, y, z);
    });
    scene3D.entityColorChanged.connect((trackIndex, hex) => applyEntityColor(trackIndex, hex));
    scene3D.entityVisibilityChanged.connect((trackIndex, vis) => applyEntityVisibility(trackIndex, vis));
    scene3D.trackSelected.connect((trackIndex) => setSelectedTrack(trackIndex));

    // Phase 2: JS-side clock seeding from audio clock
    scene3D.playStarted.connect((audioTimeMs) => {
        playStartMs = audioTimeMs;
        playStartPerfNow = performance.now();
        isPlaying = true;
    });
    scene3D.playStopped.connect((audioTimeMs) => {
        isPlaying = false;
        playStartMs = audioTimeMs;
    });

    // Phase 2: batched spatial frame — all tracks' live state in one signal
    scene3D.spatialFrameUpdate.connect((audioTimeMs, data) => {
        // Anchor JS clock from audio clock
        playStartMs = audioTimeMs;
        playStartPerfNow = performance.now();
        // Unpack and cache spatial state [trackIdx, x, y, z, radius, ...]
        for (let i = 0; i + 4 < data.length; i += 5) {
            const trackIdx = data[i] | 0;
            const sf = spatialCache.get(trackIdx) || {};
            sf.x = data[i+1];
            sf.y = data[i+2];
            sf.z = data[i+3];
            sf.radius = data[i+4];
            spatialCache.set(trackIdx, sf);
            // Apply to 2D scene: project (x, z) to top-down, scale by radius
            const e = entities.get(trackIdx);
            if (e && e.mesh.visible) {
                e.mesh.position.set(sf.x, sf.z, 0);  // Top-down: X+Z plane
                const s = Math.max(0.3, sf.radius) / 0.5;
                e.mesh.scale.setScalar(s);
            }
        }
    });

    scene3D.sceneReset.connect(() => {
        for (const tIdx of kfMarkers.keys()) clearKeyframesForTrack(tIdx);
        kfMarkers.clear();
        for (const [, line] of pathLines) {
            scene.remove(line); line.geometry.dispose(); line.material.dispose();
        }
        pathLines.clear();
        clearAllEntities();
    });

    // Phase 1: keyframe markers + path line
    scene3D.keyframesCleared.connect((trackIndex) => {
        clearKeyframesForTrack(trackIndex);
        // Tangent handles managed by explicit tangentsCleared signal only.
    });
    scene3D.keyframeAdded.connect((trackIndex, kfId, x, y, z, interp) => {
        addKfMarker(trackIndex, kfId, x, y, z, interp);
    });
    scene3D.keyframeUpdated.connect((trackIndex, kfId, x, y, z, interp) => {
        updateKfMarker(trackIndex, kfId, x, y, z, interp);
    });
    scene3D.keyframeRemoved.connect((trackIndex, kfId) => {
        removeKfMarker(trackIndex, kfId);
        if (kfId === tangentHandles.kfId) clearTangentHandles();
    });
    scene3D.pathSampled.connect((trackIndex, flat) => setPathFor(trackIndex, flat));

    // Phase 2: Bezier tangent handles
    scene3D.tangentsForSelected.connect((kfId, kx, ky, kz, inX, inY, inZ, outX, outY, outZ) => {
        showTangentHandles(kfId, kx, ky, kz, inX, inY, inZ, outX, outY, outZ);
    });
    scene3D.tangentsCleared.connect(() => clearTangentHandles());

    scene3D.entityIds((ids) => { ids.forEach((id) => bootstrapEntity(scene3D, id)); });
});
</script>
