<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DAW-500 Three.js Scene</title>
<style>
  @font-face {
    font-family: 'Source Sans Pro';
    src: url('qrc:///Resource/font/SourceSansPro-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1e1e1e;
               font-family: 'Source Sans Pro', sans-serif; }
  #status, #hint {
      font-family: 'Source Sans Pro', sans-serif;
      font-size: 13px;
      font-weight: normal;
      color: #aaa;
      letter-spacing: 0;
      line-height: 1;
  }
  #status { position: absolute; top: 8px; right: 8px; }
  #hint   { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); }
  #gizmoWrap { position: absolute; left: 10px; bottom: 28px; width: 80px; height: 80px;
               pointer-events: none; }
  #gizmoWrap canvas { position: absolute; left: 0; top: 0; width: 80px; height: 80px; }
</style>
</head>
<body>
<div id="status">connecting…</div>
<div id="hint">Left-drag: orbit | Right-drag: pan | Scroll: zoom | Click sphere: select | Drag arrows: move</div>
<div id="gizmoWrap">
  <canvas id="gizmo3d"></canvas>
  <canvas id="gizmoLbl"></canvas>
</div>

<!-- Bridge to C++. qwebchannel.js is provided by Qt at this fixed URL. -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="qrc:///web/lib/three.min.js"></script>
<script src="qrc:///web/lib/OrbitControls.js"></script>
<script src="qrc:///web/lib/TransformControls.js"></script>
<script>
'use strict';

const DEFAULT_COLOR = '#888888';
const $status = document.getElementById('status');
let selectedTrackIndex = -1;

// ── Scene ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1e1e);

const camera = new THREE.PerspectiveCamera(
    55, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(4, 5, 9);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
// perf-3d-playback: cap DPR so high-DPI displays don't quadruple fragment work
// during camera rotation with many objects.
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x888888, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 10, 7);
scene.add(sun);

// 30×30 floor grid centred at the origin (matches QtQuick3D version)
scene.add(new THREE.GridHelper(30, 30, 0x484848, 0x333333));

// (no center axes — orientation shown by corner gizmo only)

// ── Bottom-left orientation gizmo ───────────────────────────────────────────
const gCanvas = document.getElementById('gizmo3d');
const gRenderer = new THREE.WebGLRenderer({ canvas: gCanvas, antialias: true, alpha: true });
gRenderer.setPixelRatio(window.devicePixelRatio);
gRenderer.setSize(80, 80, false);
gRenderer.setClearColor(0x000000, 0);

const gScene = new THREE.Scene();
gScene.add(new THREE.AxesHelper(0.9));
const gCamera = new THREE.PerspectiveCamera(50, 1, 0.01, 10);

const gLblCanvas = document.getElementById('gizmoLbl');
const gLblCtx = gLblCanvas.getContext('2d');
gLblCanvas.width = 80;
gLblCanvas.height = 80;

function syncGizmo() {
    const dir = camera.position.clone().sub(controls ? controls.target : new THREE.Vector3()).normalize();
    gCamera.position.copy(dir.multiplyScalar(2.5));
    gCamera.up.copy(camera.up);
    gCamera.lookAt(0, 0, 0);
}

function drawGizmoLabels() {
    gLblCtx.clearRect(0, 0, 80, 80);
    gLblCtx.font = '13px "Source Sans Pro", sans-serif';
    const axes = [
        { dir: new THREE.Vector3(1, 0, 0), label: 'X', color: '#ff5555' },
        { dir: new THREE.Vector3(0, 1, 0), label: 'Y', color: '#55ee55' },
        { dir: new THREE.Vector3(0, 0, 1), label: 'Z', color: '#5599ff' },
    ];
    for (const ax of axes) {
        const v = ax.dir.clone().multiplyScalar(0.9);
        v.project(gCamera);
        const x = (v.x + 1) / 2 * 80;
        const y = (1 - (v.y + 1) / 2) * 80;
        gLblCtx.fillStyle = ax.color;
        gLblCtx.fillText(ax.label, x + 2, y + 4);
    }
}

// ── Camera controls ─────────────────────────────────────────────────────────
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = false;
controls.minDistance = 0.5;
controls.maxDistance = 100;
controls.target.set(0, 0, 0);

// Skip the gizmo render + label pass when camera is idle and not playing.
let _gizmoDirty = true;
controls.addEventListener('change', () => { _gizmoDirty = true; });

// ── Track entities ──────────────────────────────────────────────────────────
const entities = new Map();   // trackIndex -> { mesh, baseColor }

// ── Keyframes & paths (Phase 1) ─────────────────────────────────────────────
// kfMarkers: Map<trackIndex, Map<kfId, { mesh, interp }>>
const kfMarkers = new Map();
// kfMarkerMaterials: Map<trackIndex, MeshPhongMaterial> — one shared marker
// material per track so N keyframes don't allocate N materials.
const kfMarkerMaterials = new Map();
// pathLines: Map<trackIndex, THREE.Line>
const pathLines = new Map();
// perf-3d-playback: precomputed path samples per track, plus their time range.
// During playback the rAF loop walks this polyline by playhead time.
//   trackIndex -> { t0Ms, t1Ms, samples: Float32Array (xyz triples), n: int }
const paths = new Map();

// Playback state mirror — updated from QWebChannel signals.
let isPlaying = false;
let currentPlayheadMs = 0;
let playheadRecvAtPerfMs = 0;

// Phase 2: JS-side clock seeded by audio clock, anchored by batch frame arrivals.
// playStarted(audioTimeMs) sets playStartMs + playStartPerfNow, enabling smooth
// extrapolation independent of QWebChannel jitter.
let playStartMs = 0;
let playStartPerfNow = 0;

// Phase 2: spatial state snapshot — per-track {x, y, z, radius}, updated by
// spatialFrameUpdate batch signal. Used by animate() to set mesh position/scale.
const spatialCache = new Map();
let _spatialDirty = false;

const KF_INTERP_HOLD = 0;
const KF_INTERP_LINEAR = 1;
const KF_INTERP_BEZIER = 2;

function makeKfGeometry(interp) {
    if (interp === KF_INTERP_LINEAR) return new THREE.OctahedronGeometry(0.13, 0);
    if (interp === KF_INTERP_HOLD)   return new THREE.BoxGeometry(0.18, 0.18, 0.18);
    return new THREE.SphereGeometry(0.10, 16, 16); // bezier
}

function trackBaseColor(trackIndex) {
    const e = entities.get(trackIndex);
    return e ? e.baseColor : new THREE.Color(DEFAULT_COLOR);
}

function clearKeyframesForTrack(trackIndex) {
    const m = kfMarkers.get(trackIndex);
    if (m) {
        for (const { mesh } of m.values()) {
            scene.remove(mesh);
            mesh.geometry.dispose();
            // material is shared via kfMarkerMaterials — do not dispose here
        }
        m.clear();
    }
    const sharedMat = kfMarkerMaterials.get(trackIndex);
    if (sharedMat) { sharedMat.dispose(); kfMarkerMaterials.delete(trackIndex); }
}

// Lazily build (or refresh on color change) the single material reused by all
// keyframe markers of a given track.
function ensureKfMarkerMaterial(trackIndex) {
    let mat = kfMarkerMaterials.get(trackIndex);
    const baseColor = trackBaseColor(trackIndex);
    if (!mat) {
        mat = new THREE.MeshPhongMaterial({
            color: baseColor.clone(),
            emissive: baseColor.clone().multiplyScalar(0.6),
            shininess: 60,
        });
        kfMarkerMaterials.set(trackIndex, mat);
    } else {
        mat.color.copy(baseColor);
        mat.emissive.copy(baseColor).multiplyScalar(0.6);
    }
    return mat;
}

function addKfMarker(trackIndex, kfId, x, y, z, interp) {
    let map = kfMarkers.get(trackIndex);
    if (!map) { map = new Map(); kfMarkers.set(trackIndex, map); }
    // If a marker already exists with this id (race / re-bootstrap), replace it.
    const existing = map.get(kfId);
    if (existing) {
        scene.remove(existing.mesh);
        existing.mesh.geometry.dispose();
        // material is shared per-track, do not dispose
    }
    const mat = ensureKfMarkerMaterial(trackIndex);
    const mesh = new THREE.Mesh(makeKfGeometry(interp), mat);
    mesh.position.set(x, y, z);
    mesh.userData = { type: 'keyframe', trackIndex, kfId, interp };
    scene.add(mesh);
    map.set(kfId, { mesh, interp });
}

// R6: in-place update — keeps the same Mesh object across pos/interp changes.
// Geometry is replaced only when the interp actually changed (ie when the
// shape needs to swap between sphere/octahedron/box).
function updateKfMarker(trackIndex, kfId, x, y, z, interp) {
    const map = kfMarkers.get(trackIndex);
    const entry = map ? map.get(kfId) : null;
    if (!entry) { addKfMarker(trackIndex, kfId, x, y, z, interp); return; }
    entry.mesh.position.set(x, y, z);
    if (entry.interp !== interp) {
        entry.mesh.geometry.dispose();
        entry.mesh.geometry = makeKfGeometry(interp);
        entry.mesh.userData.interp = interp;
        entry.interp = interp;
    }
}

function removeKfMarker(trackIndex, kfId) {
    const map = kfMarkers.get(trackIndex);
    const entry = map ? map.get(kfId) : null;
    if (!entry) return;
    scene.remove(entry.mesh);
    entry.mesh.geometry.dispose();
    // shared per-track material — keep until clearKeyframesForTrack
    map.delete(kfId);
}

function setPathFor(trackIndex, t0, t1, flat) {
    const haveData = !!flat && flat.length >= 6;
    let line = pathLines.get(trackIndex);

    if (!haveData) {
        if (line) {
            scene.remove(line); line.geometry.dispose(); line.material.dispose();
            pathLines.delete(trackIndex);
        }
        paths.delete(trackIndex);
        return;
    }

    // perf-3d-playback: cache the polyline + its time range so the rAF loop
    // can resolve playback positions without crossing the bridge.
    {
        const n = (flat.length / 3) | 0;
        let entry = paths.get(trackIndex);
        if (!entry || entry.samples.length !== flat.length) {
            entry = { t0Ms: t0, t1Ms: t1, samples: new Float32Array(flat.length), n };
            paths.set(trackIndex, entry);
        } else {
            entry.t0Ms = t0;
            entry.t1Ms = t1;
            entry.n = n;
        }
        for (let i = 0; i < flat.length; ++i) entry.samples[i] = flat[i];
    }

    // Path just changed — re-evaluate entity position at the current playhead
    // so keyframe drag is reflected in real time (must be before early return).
    if (!isPlaying) {
        const pos = evaluatePathAt(paths.get(trackIndex), currentPlayheadMs);
        if (pos) {
            const e = entities.get(trackIndex);
            if (e && e.mesh.visible) {
                e.mesh.position.set(pos[0], pos[1], pos[2]);
                const sf = spatialCache.get(trackIndex) || {};
                sf.x = pos[0]; sf.y = pos[1]; sf.z = pos[2];
                spatialCache.set(trackIndex, sf);
            }
        }
    }

    // R6: reuse the existing line + geometry when the sample count matches.
    // This is the path that fires 60Hz during tangent drag — disposing and
    // recreating BufferGeometry every frame causes visible pauses; updating
    // the position attribute in place is allocation-free.
    if (line && line.geometry.attributes.position
        && line.geometry.attributes.position.array.length === flat.length) {
        const arr = line.geometry.attributes.position.array;
        for (let i = 0; i < flat.length; ++i) arr[i] = flat[i];
        line.geometry.attributes.position.needsUpdate = true;
        line.geometry.computeBoundingSphere();
        return;
    }

    if (line) { scene.remove(line); line.geometry.dispose(); line.material.dispose(); }
    const baseColor = trackBaseColor(trackIndex);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(flat, 3));
    line = new THREE.Line(geo, new THREE.LineBasicMaterial({
        color: baseColor, transparent: true, opacity: 0.7,
    }));
    scene.add(line);
    pathLines.set(trackIndex, line);
}

// ── perf-3d-playback: rAF-side polyline evaluation ──────────────────────────
// Walks the precomputed 128-sample path by time, with linear interp between
// adjacent samples. Bezier curvature is already baked into the samples Qt
// pushed via pathSampled, so this matches what ObjectPosAutomation::evaluate
// would have computed on the C++ side.
const _evalOut = [0, 0, 0];
function evaluatePathAt(p, tMs) {
    if (!p || p.n < 1) return null;
    if (p.n < 2 || p.t1Ms <= p.t0Ms) {
        _evalOut[0] = p.samples[0];
        _evalOut[1] = p.samples[1];
        _evalOut[2] = p.samples[2];
        return _evalOut;
    }
    let u = (tMs - p.t0Ms) / (p.t1Ms - p.t0Ms);
    if (u <= 0) {
        _evalOut[0] = p.samples[0];
        _evalOut[1] = p.samples[1];
        _evalOut[2] = p.samples[2];
        return _evalOut;
    }
    if (u >= 1) {
        const k = (p.n - 1) * 3;
        _evalOut[0] = p.samples[k];
        _evalOut[1] = p.samples[k + 1];
        _evalOut[2] = p.samples[k + 2];
        return _evalOut;
    }
    const idxF = u * (p.n - 1);
    const i0 = idxF | 0;
    const i1 = (i0 + 1 < p.n) ? i0 + 1 : i0;
    const f = idxF - i0;
    const a0 = i0 * 3, a1 = i1 * 3;
    _evalOut[0] = p.samples[a0]     * (1 - f) + p.samples[a1]     * f;
    _evalOut[1] = p.samples[a0 + 1] * (1 - f) + p.samples[a1 + 1] * f;
    _evalOut[2] = p.samples[a0 + 2] * (1 - f) + p.samples[a1 + 2] * f;
    return _evalOut;
}

function updatePlaybackPositions() {
    // Legacy path evaluation for trajectory LINE geometry only (kept for visualization).
    // Per-track position is now driven by spatialFrameUpdate batch signal + JS clock.
    if (paths.size === 0) return;
}

function updateFromSpatialCache() {
    // During playback: run every rAF frame so the curve is evaluated at the smooth
    // JS clock time (tEff), not just when a new WebChannel message arrives.
    if (!_spatialDirty && !isPlaying) return;

    // Smooth JS-side clock seeded by audio engine via playStarted / spatialFrameUpdate.
    const tEff = isPlaying
        ? playStartMs + (performance.now() - playStartPerfNow)
        : playStartMs;

    for (const [trackIndex, sf] of spatialCache) {
        if (trackIndex === _draggingTrackIndex) continue;
        const e = entities.get(trackIndex);
        if (!e || !e.mesh.visible) continue;

        // During playback, evaluate the pre-sampled Bezier curve at the extrapolated
        // clock time so position updates at rAF rate (60+ fps) rather than at the
        // WebChannel delivery rate (~60Hz with jitter → discrete jumps).
        // Falls back to the last C++ snapshot when no path exists (no keyframes yet).
        const p = paths.get(trackIndex);
        if (isPlaying && p && p.n > 1) {
            const pos = evaluatePathAt(p, tEff);
            if (pos) e.mesh.position.set(pos[0], pos[1], pos[2]);
        } else {
            e.mesh.position.set(sf.x, sf.y, sf.z);
        }

        // Radius still comes from the C++ snapshot (not on the path).
        const s = Math.max(0.3, sf.radius) / 0.5;
        e.mesh.scale.setScalar(s);
    }

    // Keep dirty during playback so every rAF frame re-evaluates the curve.
    if (!isPlaying) _spatialDirty = false;
}

// ── Phase 2: Bezier tangent handle visualisation ────────────────────────────
const tangentHandles = { inMesh: null, outMesh: null, inLine: null, outLine: null, kfId: null };

function clearTangentHandles() {
    for (const k of ['inMesh', 'outMesh', 'inLine', 'outLine']) {
        if (tangentHandles[k]) {
            scene.remove(tangentHandles[k]);
            tangentHandles[k].geometry.dispose();
            if (tangentHandles[k].material) tangentHandles[k].material.dispose();
            tangentHandles[k] = null;
        }
    }
    tangentHandles.kfId = null;
    tangentHandles.trackIndex = -1;
}

function findTrackForKf(kfId) {
    for (const [trackIndex, map] of kfMarkers) {
        if (map.has(kfId)) return trackIndex;
    }
    return -1;
}

function showTangentHandles(kfId, kx, ky, kz, inX, inY, inZ, outX, outY, outZ) {
    tangentHandles.trackIndex = findTrackForKf(kfId);
    const kfPos  = new THREE.Vector3(kx, ky, kz);
    const inPos  = new THREE.Vector3(kx + inX,  ky + inY,  kz + inZ);
    const outPos = new THREE.Vector3(kx + outX, ky + outY, kz + outZ);

    // Reuse existing meshes when same kfId — keeps drag glassy & avoids GPU churn.
    if (tangentHandles.kfId === kfId && tangentHandles.inMesh) {
        tangentHandles.inMesh.position.copy(inPos);
        tangentHandles.outMesh.position.copy(outPos);
        updateTangentLine(tangentHandles.inLine,  kfPos, inPos);
        updateTangentLine(tangentHandles.outLine, kfPos, outPos);
        tangentHandles.kfPos = kfPos;
        return;
    }

    clearTangentHandles();
    tangentHandles.kfId = kfId;
    tangentHandles.kfPos = kfPos;
    const hColor  = new THREE.Color(0xffaa00);
    const mkMat   = () => new THREE.MeshPhongMaterial({
        color: hColor, emissive: hColor.clone().multiplyScalar(0.5) });
    const mkLine  = (a, b) => new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([a, b]),
        new THREE.LineBasicMaterial({ color: hColor, transparent: true, opacity: 0.7 }));
    const hGeom = new THREE.SphereGeometry(0.09, 12, 12);

    tangentHandles.inMesh  = new THREE.Mesh(hGeom.clone(), mkMat());
    tangentHandles.inMesh.position.copy(inPos);
    tangentHandles.inMesh.userData = { type: 'tangent', kfId, side: 'in' };
    scene.add(tangentHandles.inMesh);

    tangentHandles.outMesh = new THREE.Mesh(hGeom.clone(), mkMat());
    tangentHandles.outMesh.position.copy(outPos);
    tangentHandles.outMesh.userData = { type: 'tangent', kfId, side: 'out' };
    scene.add(tangentHandles.outMesh);

    tangentHandles.inLine  = mkLine(kfPos, inPos);
    scene.add(tangentHandles.inLine);
    tangentHandles.outLine = mkLine(kfPos, outPos);
    scene.add(tangentHandles.outLine);

    hGeom.dispose();
}

function updateTangentLine(line, a, b) {
    const pos = line.geometry.attributes.position;
    pos.array[0] = a.x; pos.array[1] = a.y; pos.array[2] = a.z;
    pos.array[3] = b.x; pos.array[4] = b.y; pos.array[5] = b.z;
    pos.needsUpdate = true;
    line.geometry.computeBoundingSphere();
}

function setHandleHighlight(mesh, hover) {
    if (!mesh) return;
    const m = mesh.material;
    const c = new THREE.Color(0xffaa00);
    if (hover) {
        m.color.set(0xffe066);
        m.emissive.copy(c);   // strong glow
        mesh.scale.setScalar(1.35);
    } else {
        m.color.copy(c);
        m.emissive.copy(c).multiplyScalar(0.5);
        mesh.scale.setScalar(1.0);
    }
}

function ensureEntity(trackIndex) {
    if (entities.has(trackIndex)) return entities.get(trackIndex);
    const baseColor = new THREE.Color(DEFAULT_COLOR);
    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 32, 16),
        new THREE.MeshPhongMaterial({
            color: baseColor,
            emissive: baseColor.clone().multiplyScalar(0.30),
            shininess: 80,
            transparent: true,
            opacity: 0.95,
        }));
    mesh.userData.trackIndex = trackIndex;
    scene.add(mesh);
    const entry = { mesh, baseColor };
    entities.set(trackIndex, entry);
    return entry;
}

function applyEntityColor(trackIndex, hex) {
    const e = entities.get(trackIndex);
    if (!e || !hex) return;
    e.baseColor.set(hex);
    e.mesh.material.color.copy(e.baseColor);
    const sel = (trackIndex === selectedTrackIndex);
    e.mesh.material.emissive.copy(e.baseColor).multiplyScalar(sel ? 0.85 : 0.30);
    // Refresh the shared kf-marker material so existing markers re-tint.
    const mkMat = kfMarkerMaterials.get(trackIndex);
    if (mkMat) {
        mkMat.color.copy(e.baseColor);
        mkMat.emissive.copy(e.baseColor).multiplyScalar(0.6);
    }
    const line = pathLines.get(trackIndex);
    if (line) line.material.color.copy(e.baseColor);
}

function applyEntityVisibility(trackIndex, visible) {
    const e = entities.get(trackIndex);
    if (!e) return;
    e.mesh.visible = visible;
    if (!visible && transformCtl && transformCtl.object === e.mesh)
        transformCtl.detach();
    const line = pathLines.get(trackIndex);
    if (line) line.visible = visible;
    const kfMap = kfMarkers.get(trackIndex);
    if (kfMap) {
        for (const entry of kfMap.values()) entry.mesh.visible = visible;
    }
    if (!visible && tangentHandles.trackIndex === trackIndex)
        clearTangentHandles();
}

function setSelectedTrack(trackIndex) {
    selectedTrackIndex = trackIndex;
    for (const [k, e] of entities) {
        const sel = (k === trackIndex);
        e.mesh.scale.setScalar(sel ? 1.3 : 1.0);
        e.mesh.material.emissive.copy(e.baseColor).multiplyScalar(sel ? 0.85 : 0.30);
    }
    const target = entities.get(trackIndex);
    if (transformCtl) {
        if (target && target.mesh.visible) transformCtl.attach(target.mesh);
        else                                transformCtl.detach();
    }
}

function clearAllEntities() {
    if (transformCtl) transformCtl.detach();
    for (const e of entities.values()) {
        scene.remove(e.mesh);
        e.mesh.geometry.dispose();
        e.mesh.material.dispose();
    }
    entities.clear();
}

// ── Drag gizmo (TransformControls — X/Y/Z arrows on the selected sphere) ────
const transformCtl = new THREE.TransformControls(camera, renderer.domElement);
transformCtl.setMode('translate');
transformCtl.setSize(1.5);
scene.add(transformCtl);

// Gizmo (XYZ axis arrows): live preview during drag, commit on release.
// commitObjectLocation in C++ gates by Auto Key Mode — when ON it writes a kf,
// when OFF the position update is purely visual.
let _xformLastTrack = -1;
// perf-3d-playback: while the user drags a sphere via the XYZ gizmo the rAF
// loop must NOT overwrite that mesh from the path samples — track which
// trackIndex is being dragged and skip it in updatePlaybackPositions.
let _draggingTrackIndex = -1;
transformCtl.addEventListener('dragging-changed', (ev) => {
    controls.enabled = !ev.value;
    if (ev.value) {
        const obj = transformCtl.object;
        _draggingTrackIndex = (obj && obj.userData) ? (obj.userData.trackIndex ?? -1) : -1;
    } else {
        _draggingTrackIndex = -1;
    }
    if (!ev.value && _xformLastTrack >= 0 && transformCtl.object && window.scene3D) {
        const obj = transformCtl.object;
        window.scene3D.entityCommittedInScene(_xformLastTrack,
            obj.position.x, obj.position.y, obj.position.z);
        _xformLastTrack = -1;
    }
});

transformCtl.addEventListener('objectChange', () => {
    const obj = transformCtl.object;
    if (!obj || !window.scene3D) return;
    const idx = obj.userData.trackIndex;
    if (idx !== undefined) {
        _xformLastTrack = idx;
        window.scene3D.entityMovedLiveInScene(idx, obj.position.x, obj.position.y, obj.position.z);
    }
});

// ── Tangent-handle drag (Phase 3) ───────────────────────────────────────────
// Capture-phase pointerdown so it pre-empts OrbitControls + TransformControls.
const tdRay   = new THREE.Raycaster();
const tdNdc   = new THREE.Vector2();
const tdPlane = new THREE.Plane();
const tdHit   = new THREE.Vector3();
let tDrag = null;     // { mesh, side } during drag
let tHover = null;    // currently hovered handle mesh

function tangentMeshes() {
    const out = [];
    if (tangentHandles.inMesh)  out.push(tangentHandles.inMesh);
    if (tangentHandles.outMesh) out.push(tangentHandles.outMesh);
    return out;
}
function rayFromEvent(ev) {
    const r = renderer.domElement.getBoundingClientRect();
    tdNdc.x =  ((ev.clientX - r.left) / r.width)  * 2 - 1;
    tdNdc.y = -((ev.clientY - r.top)  / r.height) * 2 + 1;
    tdRay.setFromCamera(tdNdc, camera);
}
function pickTangentAt(ev) {
    const meshes = tangentMeshes();
    if (!meshes.length) return null;
    rayFromEvent(ev);
    const hits = tdRay.intersectObjects(meshes, false);
    return hits.length ? hits[0].object : null;
}

renderer.domElement.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0) return;
    const hit = pickTangentAt(ev);
    if (!hit) return;
    ev.stopPropagation();
    ev.preventDefault();
    controls.enabled = false;
    if (transformCtl) transformCtl.enabled = false;
    try { renderer.domElement.setPointerCapture(ev.pointerId); } catch (_) {}

    tDrag = { mesh: hit, side: hit.userData.side };
    setHandleHighlight(hit, true);
    // Plane through the kf center, facing the camera
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    tdPlane.setFromNormalAndCoplanarPoint(camDir.normalize(), tangentHandles.kfPos);
}, true);

renderer.domElement.addEventListener('pointermove', (ev) => {
    if (tDrag) {
        rayFromEvent(ev);
        if (tdRay.ray.intersectPlane(tdPlane, tdHit) && window.scene3D) {
            const off = tdHit.clone().sub(tangentHandles.kfPos);
            tDrag.lastVec = { x: off.x, y: off.y, z: off.z };
            window.scene3D.tangentChangedLiveInScene(
                tangentHandles.kfId, tDrag.side, off.x, off.y, off.z);
        }
        return;
    }
    // Hover feedback
    const hit = pickTangentAt(ev);
    if (hit !== tHover) {
        if (tHover) setHandleHighlight(tHover, false);
        tHover = hit;
        if (tHover) setHandleHighlight(tHover, true);
        renderer.domElement.style.cursor = tHover ? 'grab' : '';
    }
});

function endTangentDrag(ev) {
    if (!tDrag) return;
    try { renderer.domElement.releasePointerCapture(ev.pointerId); } catch (_) {}
    setHandleHighlight(tDrag.mesh, false);
    // Single commit on release — one undo entry per tangent transform.
    if (tDrag.lastVec && tangentHandles.kfId && window.scene3D) {
        window.scene3D.tangentCommittedInScene(
            tangentHandles.kfId, tDrag.side,
            tDrag.lastVec.x, tDrag.lastVec.y, tDrag.lastVec.z);
    }
    tDrag = null;
    controls.enabled = true;
    if (transformCtl) transformCtl.enabled = true;
}
renderer.domElement.addEventListener('pointerup',     endTangentDrag);
renderer.domElement.addEventListener('pointercancel', endTangentDrag);
window.addEventListener('blur', () => { if (tDrag) endTangentDrag({ pointerId: -1 }); });

// ── Picking (click-to-select) ───────────────────────────────────────────────
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let pressAt = null;

renderer.domElement.addEventListener('pointerdown', (ev) => {
    pressAt = { x: ev.clientX, y: ev.clientY };
});
renderer.domElement.addEventListener('pointerup', (ev) => {
    if (!pressAt) return;
    const moved = Math.hypot(ev.clientX - pressAt.x, ev.clientY - pressAt.y);
    pressAt = null;
    if (moved > 4) return;   // it was a drag, not a click

    const r = renderer.domElement.getBoundingClientRect();
    ndc.x =  ((ev.clientX - r.left) / r.width)  * 2 - 1;
    ndc.y = -((ev.clientY - r.top)  / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);

    // Hit-test kf markers FIRST (smaller meshes, user-intent priority), then
    // fall back to entity spheres. Tangent handles are picked separately in
    // their own pointerdown handler.
    const kfMeshes = [];
    for (const map of kfMarkers.values()) {
        for (const { mesh } of map.values()) kfMeshes.push(mesh);
    }
    const kfHits = ray.intersectObjects(kfMeshes, false);
    if (kfHits.length && window.scene3D) {
        const ud = kfHits[0].object.userData;
        if (ud && ud.kfId !== undefined && ud.trackIndex !== undefined) {
            window.scene3D.keyframeClickedInScene(ud.trackIndex, ud.kfId);
            return;
        }
    }

    const meshes = [...entities.values()].map(e => e.mesh);
    const hits = ray.intersectObjects(meshes, false);
    if (hits.length && window.scene3D) {
        const idx = hits[0].object.userData.trackIndex;
        if (idx !== undefined) window.scene3D.entityClicked(idx);
    }
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    _gizmoDirty = true;
});

document.fonts.ready.then(() => {
    (function animate() {
        requestAnimationFrame(animate);
        updateFromSpatialCache();
        controls.update();
        renderer.render(scene, camera);
        // Only re-render the corner gizmo and labels when camera moved or playing.
        // Avoids a redundant WebGL flush + Canvas2D redraw every idle frame.
        if (_gizmoDirty || isPlaying) {
            syncGizmo();
            gRenderer.render(gScene, gCamera);
            drawGizmoLabels();
            _gizmoDirty = false;
        }
    })();
});

// ── QWebChannel bridge to Scene3DController ────────────────────────────────
function bootstrapEntity(scene3D, id) {
    ensureEntity(id);
    scene3D.entityColor(id, (hex) => applyEntityColor(id, hex));
    scene3D.entityVisible(id, (vis) => { applyEntityVisibility(id, vis); updateStatus(); });
}

function updateStatus() {
    const visibleCount = [...entities.values()].filter(e => e.mesh.visible).length;
    $status.textContent = 'connected | entities: ' + entities.size + ' (visible: ' + visibleCount + ')';
}

new QWebChannel(qt.webChannelTransport, (channel) => {
    const scene3D = channel.objects.scene3D;
    window.scene3D = scene3D;
    $status.textContent = 'connected';

    scene3D.entityAdded.connect((trackIndex, x, y, z) => {
        const e = ensureEntity(trackIndex);
        // Snap once on add. If a path is later attached, the rAF loop takes over.
        if (!paths.has(trackIndex)) e.mesh.position.set(x, y, z);
        scene3D.entityColor(trackIndex, (hex) => applyEntityColor(trackIndex, hex));
        scene3D.entityVisible(trackIndex, (vis) => { applyEntityVisibility(trackIndex, vis); updateStatus(); });
        updateStatus();
    });
    scene3D.entityPositionChanged.connect((trackIndex, x, y, z) => {
        const e = ensureEntity(trackIndex);
        e.mesh.position.set(x, y, z);
        // Keep spatialCache in sync so the rAF loop doesn't snap back on the
        // next dirty frame (e.g. during 2D-view drag or gizmo drag).
        const sf = spatialCache.get(trackIndex) || {};
        sf.x = x; sf.y = y; sf.z = z;
        spatialCache.set(trackIndex, sf);
    });
    scene3D.playheadMoved.connect((tMs) => {
        currentPlayheadMs = tMs;
        playheadRecvAtPerfMs = performance.now();
        if (isPlaying) return;
        for (const [trackIndex, p] of paths) {
            const pos = evaluatePathAt(p, tMs);
            if (!pos) continue;
            const e = entities.get(trackIndex);
            if (!e || !e.mesh.visible) continue;
            e.mesh.position.set(pos[0], pos[1], pos[2]);
            const sf = spatialCache.get(trackIndex) || {};
            sf.x = pos[0]; sf.y = pos[1]; sf.z = pos[2];
            spatialCache.set(trackIndex, sf);
        }
    });
    scene3D.playbackStateChanged.connect((playing) => {
        isPlaying = !!playing;
        // Re-base the extrapolation clock so we don't fast-forward on resume.
        playheadRecvAtPerfMs = performance.now();
    });

    // Phase 2: JS-side clock seeding from audio clock
    scene3D.playStarted.connect((audioTimeMs) => {
        playStartMs = audioTimeMs;
        playStartPerfNow = performance.now();
        isPlaying = true;
    });
    scene3D.playStopped.connect((audioTimeMs) => {
        isPlaying = false;
        playStartMs = audioTimeMs;  // freeze at stop time
    });

    // Phase 2: batched spatial frame — all tracks' live state in one signal.
    // Directly apply positions on receipt (mirrors scene2d.html) so 3D scene
    // updates every playback tick regardless of rAF timing or path cache state.
    scene3D.spatialFrameUpdate.connect((audioTimeMs, data) => {
        playStartMs = audioTimeMs;
        playStartPerfNow = performance.now();
        for (let i = 0; i + 4 < data.length; i += 5) {
            const trackIdx = data[i] | 0;
            const sf = spatialCache.get(trackIdx) || {};
            sf.x = data[i+1]; sf.y = data[i+2]; sf.z = data[i+3]; sf.radius = data[i+4];
            spatialCache.set(trackIdx, sf);
            if (trackIdx !== _draggingTrackIndex) {
                const e = entities.get(trackIdx);
                if (e && e.mesh.visible) {
                    e.mesh.position.set(sf.x, sf.y, sf.z);
                    e.mesh.scale.setScalar(Math.max(0.3, sf.radius) / 0.5);
                }
            }
        }
        _spatialDirty = true;
    });
    scene3D.entityColorChanged.connect((trackIndex, hex) => applyEntityColor(trackIndex, hex));
    scene3D.entityVisibilityChanged.connect((trackIndex, vis) => { applyEntityVisibility(trackIndex, vis); updateStatus(); });
    scene3D.trackSelected.connect((trackIndex) => setSelectedTrack(trackIndex));
    scene3D.sceneReset.connect(() => {
        for (const tIdx of kfMarkers.keys()) clearKeyframesForTrack(tIdx);
        kfMarkers.clear();
        for (const [, line] of pathLines) {
            scene.remove(line); line.geometry.dispose(); line.material.dispose();
        }
        pathLines.clear();
        paths.clear();
        clearAllEntities();
        updateStatus();
    });

    // Phase 1: keyframe markers + path line
    scene3D.keyframesCleared.connect((trackIndex) => {
        scene3D.log('[JS-3D] keyframesCleared track=' + trackIndex);
        clearKeyframesForTrack(trackIndex);
        // Note: tangent handles are NOT cleared here — keyframesCleared fires on
        // every automation `changed` (incl. tangent edits). Explicit
        // tangentsCleared handles non-Bezier interp transitions.
    });
    scene3D.keyframeAdded.connect((trackIndex, kfId, x, y, z, interp) => {
        scene3D.log('[JS-3D] keyframeAdded id=' + kfId + ' pos=(' + x.toFixed(3)
                  + ',' + y.toFixed(3) + ',' + z.toFixed(3) + ') interp=' + interp);
        addKfMarker(trackIndex, kfId, x, y, z, interp);
    });
    scene3D.keyframeUpdated.connect((trackIndex, kfId, x, y, z, interp) => {
        scene3D.log('[JS-3D] keyframeUpdated id=' + kfId + ' pos=(' + x.toFixed(3)
                  + ',' + y.toFixed(3) + ',' + z.toFixed(3) + ') interp=' + interp);
        updateKfMarker(trackIndex, kfId, x, y, z, interp);
    });
    scene3D.keyframeRemoved.connect((trackIndex, kfId) => {
        scene3D.log('[JS-3D] keyframeRemoved id=' + kfId);
        removeKfMarker(trackIndex, kfId);
        if (kfId === tangentHandles.kfId) clearTangentHandles();
    });
    scene3D.pathSampled.connect((trackIndex, t0, t1, flat) => {
        scene3D.log('[JS-3D] pathSampled track=' + trackIndex
                  + ' t0=' + t0 + ' t1=' + t1
                  + ' len=' + (flat ? flat.length : 0));
        setPathFor(trackIndex, t0, t1, flat);
    });

    // Phase 2: Bezier tangent handles
    scene3D.tangentsForSelected.connect((kfId, kx, ky, kz, inX, inY, inZ, outX, outY, outZ) => {
        scene3D.log('[JS-3D] tangentsForSelected id=' + kfId
                  + ' in=(' + inX.toFixed(3) + ',' + inY.toFixed(3) + ',' + inZ.toFixed(3) + ')'
                  + ' out=(' + outX.toFixed(3) + ',' + outY.toFixed(3) + ',' + outZ.toFixed(3) + ')');
        showTangentHandles(kfId, kx, ky, kz, inX, inY, inZ, outX, outY, outZ);
    });
    scene3D.tangentsCleared.connect(() => {
        scene3D.log('[JS-3D] tangentsCleared');
        clearTangentHandles();
    });

    // Bootstrap any entities that already exist on the C++ side
    scene3D.entityIds((ids) => {
        ids.forEach((id) => bootstrapEntity(scene3D, id));
        setTimeout(updateStatus, 200);
    });
});
</script>
</body>
