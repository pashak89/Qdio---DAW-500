<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DAW-500 Three.js Scene</title>
<style>
  @font-face {
    font-family: 'Source Sans Pro';
    src: url('qrc:///Resource/font/SourceSansPro-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1e1e1e;
               font-family: 'Source Sans Pro', sans-serif; }
  #status, #hint {
      font-family: 'Source Sans Pro', sans-serif;
      font-size: 13px;
      font-weight: normal;
      color: #aaa;
      letter-spacing: 0;
      line-height: 1;
  }
  #status { position: absolute; top: 8px; right: 8px; }
  #hint   { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); }
  #gizmoWrap { position: absolute; left: 10px; bottom: 28px; width: 80px; height: 80px;
               pointer-events: none; }
  #gizmoWrap canvas { position: absolute; left: 0; top: 0; width: 80px; height: 80px; }
</style>
</head>
<body>
<div id="status">connecting…</div>
<div id="hint">Left-drag: orbit | Right-drag: pan | Scroll: zoom | Click sphere: select</div>
<div id="gizmoWrap">
  <canvas id="gizmo3d"></canvas>
  <canvas id="gizmoLbl"></canvas>
</div>

<!-- Bridge to C++. qwebchannel.js is provided by Qt at this fixed URL. -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';

const PALETTE = ['#4488ff','#ff4488','#44ff88','#ffaa44',
                 '#aa44ff','#44ccff','#ff8844','#88ff44'];
const $status = document.getElementById('status');

// ── Scene ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1e1e);

const camera = new THREE.PerspectiveCamera(
    55, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(4, 5, 9);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x888888, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 10, 7);
scene.add(sun);

// 30×30 floor grid centred at the origin (matches QtQuick3D version)
scene.add(new THREE.GridHelper(30, 30, 0x484848, 0x333333));

// (no center axes — orientation shown by corner gizmo only)

// ── Bottom-left orientation gizmo ───────────────────────────────────────────
const gCanvas = document.getElementById('gizmo3d');
const gRenderer = new THREE.WebGLRenderer({ canvas: gCanvas, antialias: true, alpha: true });
gRenderer.setPixelRatio(window.devicePixelRatio);
gRenderer.setSize(80, 80, false);
gRenderer.setClearColor(0x000000, 0);

const gScene = new THREE.Scene();
gScene.add(new THREE.AxesHelper(0.9));
const gCamera = new THREE.PerspectiveCamera(50, 1, 0.01, 10);

const gLblCanvas = document.getElementById('gizmoLbl');
const gLblCtx = gLblCanvas.getContext('2d');
gLblCanvas.width = 80;
gLblCanvas.height = 80;

function syncGizmo() {
    const dir = camera.position.clone().sub(controls ? controls.target : new THREE.Vector3()).normalize();
    gCamera.position.copy(dir.multiplyScalar(2.5));
    gCamera.up.copy(camera.up);
    gCamera.lookAt(0, 0, 0);
}

function drawGizmoLabels() {
    gLblCtx.clearRect(0, 0, 80, 80);
    gLblCtx.font = '13px "Source Sans Pro", sans-serif';
    const axes = [
        { dir: new THREE.Vector3(1, 0, 0), label: 'X', color: '#ff5555' },
        { dir: new THREE.Vector3(0, 1, 0), label: 'Y', color: '#55ee55' },
        { dir: new THREE.Vector3(0, 0, 1), label: 'Z', color: '#5599ff' },
    ];
    for (const ax of axes) {
        const v = ax.dir.clone().multiplyScalar(0.9);
        v.project(gCamera);
        const x = (v.x + 1) / 2 * 80;
        const y = (1 - (v.y + 1) / 2) * 80;
        gLblCtx.fillStyle = ax.color;
        gLblCtx.fillText(ax.label, x + 2, y + 4);
    }
}

// ── Camera controls ─────────────────────────────────────────────────────────
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.5;
controls.maxDistance = 100;
controls.target.set(0, 0, 0);

// ── Track entities ──────────────────────────────────────────────────────────
const entities = new Map();   // trackIndex -> { mesh, baseColor }

function ensureEntity(trackIndex) {
    if (entities.has(trackIndex)) return entities.get(trackIndex);
    const baseColor = new THREE.Color(PALETTE[Math.abs(trackIndex) % PALETTE.length]);
    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 32, 16),
        new THREE.MeshPhongMaterial({
            color: baseColor,
            emissive: baseColor.clone().multiplyScalar(0.30),
            shininess: 80,
            transparent: true,
            opacity: 0.95,
        }));
    mesh.userData.trackIndex = trackIndex;
    scene.add(mesh);
    const entry = { mesh, baseColor };
    entities.set(trackIndex, entry);
    return entry;
}

function setSelectedTrack(trackIndex) {
    for (const [k, e] of entities) {
        const sel = (k === trackIndex);
        e.mesh.scale.setScalar(sel ? 1.3 : 1.0);
        e.mesh.material.emissive.copy(e.baseColor).multiplyScalar(sel ? 0.85 : 0.30);
    }
}

function clearAllEntities() {
    for (const e of entities.values()) {
        scene.remove(e.mesh);
        e.mesh.geometry.dispose();
        e.mesh.material.dispose();
    }
    entities.clear();
}

// ── Picking (click-to-select) ───────────────────────────────────────────────
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let pressAt = null;

renderer.domElement.addEventListener('pointerdown', (ev) => {
    pressAt = { x: ev.clientX, y: ev.clientY };
});
renderer.domElement.addEventListener('pointerup', (ev) => {
    if (!pressAt) return;
    const moved = Math.hypot(ev.clientX - pressAt.x, ev.clientY - pressAt.y);
    pressAt = null;
    if (moved > 4) return;   // it was a drag, not a click

    const r = renderer.domElement.getBoundingClientRect();
    ndc.x =  ((ev.clientX - r.left) / r.width)  * 2 - 1;
    ndc.y = -((ev.clientY - r.top)  / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);

    const meshes = [...entities.values()].map(e => e.mesh);
    const hits = ray.intersectObjects(meshes, false);
    if (hits.length && window.scene3D) {
        const idx = hits[0].object.userData.trackIndex;
        if (idx !== undefined) window.scene3D.entityClicked(idx);
    }
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

document.fonts.ready.then(() => {
    (function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
        syncGizmo();
        gRenderer.render(gScene, gCamera);
        drawGizmoLabels();
    })();
});

// ── QWebChannel bridge to Scene3DController ────────────────────────────────
new QWebChannel(qt.webChannelTransport, (channel) => {
    const scene3D = channel.objects.scene3D;
    window.scene3D = scene3D;
    $status.textContent = 'connected';

    scene3D.entityAdded.connect((trackIndex, position) => {
        const e = ensureEntity(trackIndex);
        e.mesh.position.set(position.x, position.y, position.z);
    });
    scene3D.entityPositionChanged.connect((trackIndex, position) => {
        const e = ensureEntity(trackIndex);
        e.mesh.position.set(position.x, position.y, position.z);
    });
    scene3D.trackSelected.connect((trackIndex) => setSelectedTrack(trackIndex));
    scene3D.sceneReset.connect(() => clearAllEntities());

    // Bootstrap any entities that already exist on the C++ side
    scene3D.entityIds((ids) => {
        ids.forEach((id) => {
            scene3D.entityPosition(id, (pos) => {
                const e = ensureEntity(id);
                e.mesh.position.set(pos.x, pos.y, pos.z);
            });
        });
    });
});
</script>
</body>
</html>
